name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m infinite_creativity.cli --db state/smoke.sqlite sync --adapters references
      - run: python -m infinite_creativity.cli --db state/smoke.sqlite stats
