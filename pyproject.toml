[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "infinite-creativity-mcp"
version = "0.1.0"
description = "License-aware federated creative asset catalog and agent MCP server"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.28,<2", "ijson>=3.4,<4"]

[project.scripts]
infinite-creativity = "infinite_creativity.cli:main"
infinite-creativity-mcp = "infinite_creativity.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infinite_creativity = ["data/*.json"]
